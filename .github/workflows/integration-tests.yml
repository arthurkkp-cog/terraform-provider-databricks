name: Integration Tests

# This workflow is adapted for fork usage. It runs integration tests directly
# instead of triggering tests in a separate Databricks-internal repository.
# To use this workflow, you need to set up the following secrets:
# - DATABRICKS_HOST: Your Databricks workspace URL
# - DATABRICKS_TOKEN: Your Databricks personal access token
# Integration tests are skipped if these secrets are not configured.

on:
  pull_request:
    types: [opened, synchronize]

  merge_group:
    types: [checks_requested]

jobs:
  check-secrets:
    name: Check secrets access
    runs-on: ubuntu-latest

    outputs:
      has_secrets: ${{ steps.set-secrets-status.outputs.has_secrets }}

    steps:
      - name: Check if Databricks secrets are set
        id: set-secrets-status
        run: |
          if [ -z "${{ secrets.DATABRICKS_HOST }}" ] || [ -z "${{ secrets.DATABRICKS_TOKEN }}" ]; then
            echo "Databricks secrets are not configured. Integration tests will be skipped."
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "Databricks secrets are configured."
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    needs: check-secrets
    if: github.event_name == 'pull_request' && needs.check-secrets.outputs.has_secrets == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Pull external libraries
        run: make vendor

      - name: Run integration tests
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # Run a subset of integration tests (adjust as needed)
          # Full integration tests require extensive Databricks resources
          go test -v -timeout 30m ./internal/acceptance/...

  skip-integration-tests:
    name: Integration Tests (Skipped)
    runs-on: ubuntu-latest

    needs: check-secrets
    if: github.event_name == 'pull_request' && needs.check-secrets.outputs.has_secrets == 'false'

    steps:
      - name: Skip notice
        run: |
          echo "Integration tests skipped: DATABRICKS_HOST and DATABRICKS_TOKEN secrets are not configured."
          echo "To enable integration tests, add these secrets to your repository settings."

  # Auto-approve for merge queue to avoid running integration tests twice
  auto-approve:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read

    steps:
      - name: Auto-approve Check for Merge Queue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Integration Tests',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Integration Tests',
                summary: 'Auto-approved for merge queue (tests already passed on PR)'
              }
            });
