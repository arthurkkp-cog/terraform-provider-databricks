# Adapted for fork usage - uses standard GitHub-hosted runners and PAT
name: tagging

# This workflow creates releases by running tagging.py.
# To use this workflow, set up the following secret:
# - RELEASE_PAT: A Personal Access Token with repo and workflow permissions
# Without this secret, the workflow will use GITHUB_TOKEN which may have limited permissions.

on:
  workflow_dispatch:
  # Enable for automatic tagging
  #schedule:
  #  - cron: '0 0 * * TUE'

# Ensure that only a single instance of the workflow is running at a time.
concurrency:
  group: "tagging"


jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Git configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tagging.py
